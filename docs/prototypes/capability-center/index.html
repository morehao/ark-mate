<head>

<body>

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.2 14.2A8.6 8.6 0 0 1 9.8 3.8 8.6 8.6 0 1 0 20.2 14.2Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 11v6M14 11v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.8 3h15.2a2 2 0 0 0 1.8-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3Z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M18 5l2 2"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.2-1.2"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a15 15 0 0 1 19 0M5.5 12.5a10 10 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="m4 20 11-11M14 4l.9 2.1L17 7l-2.1.9L14 10l-.9-2.1L11 7l2.1-.9L14 4ZM19 12l.6 1.4L21 14l-1.4.6L19 16l-.6-1.4L17 14l1.4-.6L19 12Z"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10h6M9 14h6M9 18h4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h5a4 4 0 0 0 0-8h-2a4 4 0 0 1 0-8h5"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.4 5.4L3 18l3 3 6.1-6.1a4 4 0 0 0 5.4-5.4l-2.5 2.5-3-3 2.5-2.5Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H4V4ZM20 4h-6a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h6V4Z"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6Z"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-loader" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
    <symbol id="i-logo" viewBox="0 0 28 28"><rect x="1" y="1" width="26" height="26" rx="8.5" fill="url(#logo-gradient)"/><path d="M7.7 19.7 13.2 8l6.6 11.7h-3.5L13.6 14l-2.5 5.7H7.7Z" fill="#07150d"/><circle cx="19.6" cy="8.4" r="1.4" fill="#eafff1"/></symbol>
    <linearGradient id="logo-gradient" x1="4" y1="3" x2="24" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#8CF3B8"/><stop offset=".5" stop-color="#3FD47B"/><stop offset="1" stop-color="#16A85C"/></linearGradient>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark"><svg><use href="#i-logo"/></svg></div>
        <div class="brand-copy">
          <div class="brand-name">ark<span>·</span>mate</div>
          <div class="brand-sub">能力中心</div>
        </div>
        <button class="icon-btn quiet sidebar-collapse" data-action="collapse-sidebar" aria-label="收起侧边栏" title="收起侧边栏">
          <svg class="icon"><use href="#i-arrow-left"/></svg>
        </button>
      </div>

      <div class="nav-block">
        <button class="nav-item" data-action="soon" data-soon="问答">
          <span class="nav-ico"><svg class="icon"><use href="#i-message"/></svg></span>
          <span class="nav-label">问答</span>
        </button>

        <div class="nav-group is-open">
          <button class="nav-item is-parent is-active" data-action="go" data-route="skills">
            <span class="nav-ico"><svg class="icon"><use href="#i-puzzle"/></svg></span>
            <span class="nav-label">扩展</span>
            <span class="nav-caret"><svg class="icon"><use href="#i-chevron-down"/></svg></span>
          </button>
          <div class="subnav">
            <button class="subnav-item is-disabled" disabled>
              <span>专家</span><span class="mini-tag">待开发</span>
            </button>
            <button class="subnav-item" data-action="go" data-route="skills">
              <span>技能</span><span class="nav-count" id="nav-skill-count">7</span>
            </button>
            <button class="subnav-item" data-action="go" data-route="connectors">
              <span>连接器</span><span class="nav-count" id="nav-mcp-count">4</span>
            </button>
          </div>
        </div>

        <button class="nav-item" data-action="soon" data-soon="用量">
          <span class="nav-ico"><svg class="icon"><use href="#i-activity"/></svg></span>
          <span class="nav-label">用量</span>
        </button>
        <button class="nav-item" data-action="soon" data-soon="定时任务">
          <span class="nav-ico"><svg class="icon"><use href="#i-clock"/></svg></span>
          <span class="nav-label">定时任务</span>
        </button>
      </div>

      <div class="sidebar-grow"></div>

      <div class="workspace-card" role="button" tabindex="0" data-action="soon" data-soon="切换工作区">
        <div class="workspace-icon"><svg class="icon"><use href="#i-folder"/></svg></div>
        <div class="workspace-copy">
          <div class="workspace-label">当前工作区</div>
          <div class="workspace-name">ark-mate</div>
        </div>
        <span class="workspace-kind">本地</span>
      </div>

      <div class="account-row">
        <div class="avatar">M</div>
        <div class="account-copy">
          <div class="account-name">mtank</div>
          <div class="account-plan">个人免费版</div>
        </div>
        <button class="icon-btn quiet" data-action="soon" data-soon="设置" aria-label="设置">
          <svg class="icon"><use href="#i-settings"/></svg>
        </button>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="crumbs" aria-label="面包屑">
          <span>扩展</span><span class="crumb-sep">/</span><b id="crumb-current">技能</b>
        </div>
        <div class="topbar-actions">
          <button class="command-pill" data-action="focus-search">
            <svg class="icon"><use href="#i-search"/></svg>
            <span>搜索能力</span>
            <kbd>⌘ K</kbd>
          </button>
          <button class="icon-btn" data-action="toggle-theme" aria-label="切换主题" title="切换主题">
            <svg class="icon theme-icon-dark"><use href="#i-moon"/></svg>
            <svg class="icon theme-icon-light"><use href="#i-sun"/></svg>
          </button>
          <button class="ghost-pill" data-action="notes">
            <svg class="icon"><use href="#i-info"/></svg>
            <span>原型说明</span>
          </button>
          <div class="top-avatar">M</div>
        </div>
      </header>

      <main id="page" class="page" tabindex="-1"></main>
    </div>
  </div>

  <div id="menu-root"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
