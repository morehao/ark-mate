<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1010" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #172033;
      --muted: #5b6475;
      --line: #64748b;
      --neutral: #e2e8f0;
      --input: #bfdbfe;
      --process: #c7d2fe;
      --storage: #99f6e4;
      --external: #fde68a;
      --risk: #fecaca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #a3adbd;
        --line: #94a3b8;
        --neutral: #334155;
        --input: #1d4ed8;
        --process: #4338ca;
        --storage: #0f766e;
        --external: #92400e;
        --risk: #991b1b;
      }
    }
    svg { background: var(--bg); }
    .title { font-size: 22px; font-weight: 650; fill: var(--fg); }
    .subtitle { font-size: 13px; fill: var(--muted); }
    .frame-header { font-size: 15px; font-weight: 650; fill: var(--fg); }
    .zone-header { font-size: 12.5px; font-weight: 600; fill: var(--muted); }
    .label { font-size: 14px; font-weight: 600; fill: var(--fg); }
    .small { font-size: 11.5px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .step-title { font-size: 13.5px; font-weight: 600; fill: var(--fg); }
    .step-detail { font-size: 11.5px; fill: var(--muted); }
    .note { font-size: 12px; font-weight: 600; fill: var(--fg); }
    .badge { font-size: 12px; font-weight: 700; fill: var(--fg); }
    .node { stroke: var(--line); stroke-width: 1; }
    .neutral { fill: var(--neutral); }
    .input { fill: var(--input); }
    .process { fill: var(--process); }
    .storage { fill: var(--storage); }
    .external { fill: var(--external); }
    .risk { fill: var(--risk); }
    .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .edge-arrow { marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); marker-end: url(#arrow); }
    .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
    .frame { fill: none; stroke: var(--line); stroke-width: 1; opacity: 0.6; }
    .spine { stroke: var(--line); stroke-width: 1.5; opacity: 0.45; }
    .marker { fill: var(--neutral); stroke: var(--line); stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="1480" height="1010" fill="var(--bg)" />

  <rect class="frame" x="32" y="104" width="512" height="800" rx="14" />
  <rect class="frame" x="576" y="104" width="872" height="800" rx="14" />
  <rect class="frame" x="32" y="922" width="1416" height="64" rx="14" />

  <rect class="zone" x="1010" y="150" width="414" height="310" rx="12" />
  <rect class="zone" x="1010" y="488" width="414" height="232" rx="12" />
  <rect class="zone" x="1010" y="744" width="414" height="148" rx="12" />

  <!-- connectors -->
  <path class="spine" d="M 76 205 L 76 775" />
  <path class="edge edge-arrow" d="M 790 240 L 790 284" />
  <path class="edge edge-arrow" d="M 790 380 L 790 538" />
  <path class="edge both" d="M 692 430 L 692 386" />
  <path class="edge both" d="M 888 430 L 888 386" />
  <path class="edge both" d="M 980 340 L 1000 340 L 1000 550 L 1020 550" />
  <path class="edge both" d="M 1000 550 L 1000 618 L 1020 618" />
  <path class="edge both" d="M 1000 618 L 1000 686 L 1020 686" />
  <path class="edge edge-arrow" d="M 790 672 L 790 706" />

  <!-- ===== 左栏：启动链 ===== -->
  <text class="frame-header" x="52" y="138">启动链 · 冷启动全程没有任何“安装”动作</text>

  <circle class="input" cx="76" cy="190" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="195" text-anchor="middle">1</text>
  <text class="step-title" x="106" y="180">双击应用 → 抢单实例锁</text>
  <text class="step-detail" x="106" y="200">锁的是核心，不是窗口数：将来多工作区可开多窗口</text>
  <text class="step-detail" x="106" y="216">只有抢到的进程才允许触碰数据目录</text>

  <circle class="input" cx="76" cy="290" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="295" text-anchor="middle">2</text>
  <text class="step-title" x="106" y="280">spawn forge-core</text>
  <text class="step-detail" x="106" y="300">校验 --web-dir（壳指向包内 dist）或内置资产，监听 127.0.0.1:0</text>
  <text class="step-detail" x="106" y="316">两个凭据只经 stdin：不进 argv、不进 env、不落文件</text>

  <circle class="input" cx="76" cy="390" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="395" text-anchor="middle">3</text>
  <text class="step-title" x="106" y="380">轮询 /v1/forge/health 直到就绪</text>
  <text class="step-detail" x="106" y="400">health 是唯一免鉴权端点，用来做就绪探针</text>
  <text class="step-detail" x="106" y="416">就绪前不开窗口：页面见不到半启动的后端</text>

  <circle class="input" cx="76" cy="490" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="495" text-anchor="middle">4</text>
  <text class="step-title" x="106" y="480">loadURL forge-app://app/，壳服务 index 与 assets</text>
  <text class="step-detail" x="106" y="500">壳从包内 dist 服务 index 与 /assets/*（immutable）</text>
  <text class="step-detail" x="106" y="516">页面 origin 恒定：磁盘缓存与本地存储跨启动稳定</text>

  <circle class="input" cx="76" cy="590" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="595" text-anchor="middle">5</text>
  <text class="step-title" x="106" y="580">REST 同源反代，事件流直连回环</text>
  <text class="step-detail" x="106" y="600">REST 经壳反代带 restToken；WS 带 streamToken（通道级）</text>
  <text class="step-detail" x="106" y="616">与浏览器入口同一份产物、同一套契约 → 一致由结构保证</text>

  <circle class="input" cx="76" cy="690" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="695" text-anchor="middle">6</text>
  <text class="step-title" x="106" y="680">拉起 ACP runtime 子进程（只认随包载荷）</text>
  <text class="step-detail" x="106" y="700">用 Electron 自带的 Node 执行：ELECTRON_RUN_AS_NODE=1</text>
  <text class="step-detail" x="106" y="716">桌面态不探测、不复用用户本机的 dsh / opencode</text>
  <text class="step-detail" x="106" y="732">私有 bin 只注入这些子进程，绝不改用户 PATH</text>

  <circle class="input" cx="76" cy="790" r="15" stroke="var(--line)" stroke-width="1" />
  <text class="badge" x="76" y="795" text-anchor="middle">7</text>
  <text class="step-title" x="106" y="780">退出：三层收尾</text>
  <text class="step-detail" x="106" y="800">问活跃任务（2s 上限，超时按“有任务”保守处理）</text>
  <text class="step-detail" x="106" y="816">SIGTERM → 宽限 → 残留进程组 SIGKILL</text>

  <text class="note" x="52" y="866">零依赖判据：无 registry 请求 · 不写系统目录 · 不改用户 PATH</text>

  <!-- ===== 右栏：部署拓扑 ===== -->
  <text class="frame-header" x="596" y="138">部署拓扑 · 随包只读资产与载荷 + 可写 FORGE_HOME</text>

  <text class="zone-header" x="1026" y="172">签名应用包 · 只读（随包签名 + 公证）</text>
  <rect class="node neutral" x="1026" y="184" width="382" height="56" rx="10" />
  <text class="label" x="1046" y="208">Electron 运行时</text>
  <text class="small" x="1046" y="228">自带 Node 24.18.1（实测）· Chromium 版本固定</text>

  <rect class="node neutral" x="1026" y="252" width="382" height="56" rx="10" />
  <text class="label" x="1046" y="276">forge-core（单一 Go 静态二进制）</text>
  <text class="small" x="1046" y="296">REST · WS · 资产层（解析 → 校验 → 服务 → 闸门）</text>

  <rect class="node neutral" x="1026" y="320" width="382" height="56" rx="10" />
  <text class="label" x="1046" y="344">随包资产与载荷</text>
  <text class="small" x="1046" y="364">前端资产（apps/web/dist）· dsh 树 · opencode · npx</text>

  <rect class="node neutral" x="1026" y="388" width="382" height="56" rx="10" />
  <text class="label mono" x="1046" y="412">assets &amp; payload manifest</text>
  <text class="small" x="1046" y="432">前端 build id / digest · 版本 · 逐文件 sha256 · Node ABI</text>

  <text class="zone-header" x="1026" y="510">FORGE_HOME · 可写（默认 ~/.forge，一份共享路径）</text>
  <rect class="node storage" x="1026" y="522" width="382" height="56" rx="10" />
  <text class="label mono" x="1046" y="546">forge.db · transcripts</text>
  <text class="small" x="1046" y="566">会话、事件、历史回放（与 CLI / 浏览器共用）</text>

  <rect class="node risk" x="1026" y="590" width="382" height="56" rx="10" />
  <text class="label mono" x="1046" y="614">vault.key</text>
  <text class="small" x="1046" y="634">凭据（0600）：丢了密文不可恢复 → 绝不静默移动</text>

  <rect class="node storage" x="1026" y="658" width="382" height="56" rx="10" />
  <text class="label mono" x="1046" y="682">logs · npm cache · runtime profiles</text>
  <text class="small" x="1046" y="702">诊断日志、包缓存、各 runtime 的隔离配置目录</text>

  <text class="zone-header" x="1026" y="768">关系（图中 ①–⑤ 标号）</text>
  <text class="small" x="1026" y="792">① 壳 spawn 核心（两个凭据经 stdin，不进 argv / env）</text>
  <text class="small" x="1026" y="816">② 核心 spawn runtime 子进程（用 Electron 自带的 Node）</text>
  <text class="small" x="1026" y="840">③ 浏览器入口 ↔ 核心（回环 HTTP + WS，同令牌）</text>
  <text class="small" x="1026" y="864">④ 桌面窗口 ↔ 壳（静态 + REST 反代）· ↔ 核心（事件流直连）</text>
  <text class="small" x="1026" y="888">⑤ 核心 ↔ 数据面 · 子进程 → 模型 API（唯一常规出站）</text>

  <rect class="node neutral" x="600" y="164" width="380" height="76" rx="10" />
  <text class="label" x="790" y="196" text-anchor="middle">Electron 壳（主进程）</text>
  <text class="small" x="790" y="218" text-anchor="middle">单实例锁 · forge-app:// 静态与反代 · 托盘 / 更新</text>

  <rect class="node process" x="600" y="290" width="380" height="90" rx="10" />
  <text class="label" x="790" y="322" text-anchor="middle">forge-core（唯一核心）</text>
  <text class="small" x="790" y="344" text-anchor="middle">回环 REST + WS + 资产层（浏览器入口）</text>
  <text class="small" x="790" y="364" text-anchor="middle">编排器 · 事件总线 · 持久层</text>

  <rect class="node input" x="600" y="430" width="184" height="68" rx="10" />
  <text class="label" x="692" y="458" text-anchor="middle">渲染进程窗口</text>
  <text class="small" x="692" y="478" text-anchor="middle">forge-app://app（桌面）</text>

  <rect class="node input" x="796" y="430" width="184" height="68" rx="10" />
  <text class="label" x="888" y="458" text-anchor="middle">浏览器入口</text>
  <text class="small" x="888" y="478" text-anchor="middle">forge web（回环 origin）</text>

  <rect class="node process" x="600" y="544" width="380" height="128" rx="10" />
  <text class="label" x="790" y="572" text-anchor="middle">ACP runtime 子进程（stdio）</text>
  <text class="small mono" x="790" y="596" text-anchor="middle">dsh --profile acp</text>
  <text class="small mono" x="790" y="622" text-anchor="middle">opencode acp</text>
  <text class="small mono" x="790" y="648" text-anchor="middle">MCP stdio（npx -y …，该 server 需联网）</text>

  <rect class="node external" x="600" y="712" width="380" height="76" rx="10" />
  <text class="label" x="790" y="742" text-anchor="middle">模型 API（用户自配 provider）</text>
  <text class="small" x="790" y="764" text-anchor="middle">首启到可用只有这一类常规出站（判据 R3）</text>

  <text class="small" x="600" y="818">默认无更新检查 · 无遥测 · 无崩溃上报；更新走手动下载安装包</text>

  <!-- ===== 边标号 ===== -->
  <circle class="marker" cx="790" cy="262" r="10" />
  <text class="badge" x="790" y="266" text-anchor="middle">1</text>
  <circle class="marker" cx="790" cy="412" r="10" />
  <text class="badge" x="790" y="416" text-anchor="middle">2</text>
  <circle class="marker" cx="692" cy="408" r="10" />
  <text class="badge" x="692" y="412" text-anchor="middle">3</text>
  <circle class="marker" cx="888" cy="408" r="10" />
  <text class="badge" x="888" y="412" text-anchor="middle">3</text>
  <circle class="marker" cx="1000" cy="470" r="10" />
  <text class="badge" x="1000" y="474" text-anchor="middle">4</text>
  <circle class="marker" cx="790" cy="689" r="10" />
  <text class="badge" x="790" y="693" text-anchor="middle">5</text>

  <!-- ===== 标题与图例 ===== -->
  <text class="title" x="40" y="52">ark-mate 桌面端：启动链与部署拓扑</text>
  <text class="subtitle" x="40" y="80">Electron 壳 + 随包资产与运行时（Node 由 Electron 提供，实测 24.18.1 满足 dsh engines）｜用户机器无需 Go / Node / pnpm / Python，也无需预装 dsh / opencode</text>

  <rect class="node neutral" x="56" y="944" width="16" height="16" rx="4" />
  <text class="small" x="82" y="957">只读：随包已签名（应用包内）</text>
  <rect class="node storage" x="336" y="944" width="16" height="16" rx="4" />
  <text class="small" x="362" y="957">可写：FORGE_HOME 数据面</text>
  <rect class="node process" x="616" y="944" width="16" height="16" rx="4" />
  <text class="small" x="642" y="957">进程：核心与它拉起的子进程</text>
  <rect class="node input" x="896" y="944" width="16" height="16" rx="4" />
  <text class="small" x="922" y="957">入口：浏览器 / 桌面窗口</text>
  <rect class="node external" x="1176" y="944" width="16" height="16" rx="4" />
  <text class="small" x="1202" y="957">出站网络（仅模型 API）</text>
</svg>
