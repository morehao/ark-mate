# ark-forge 单机容器部署（docker compose up -d --build）
#
# 镜像形态由 build.target 与两个开关共同决定（与 Dockerfile 一致）：
#   默认（不改任何变量）        → 最小镜像：只含 forge 本体，用内置 echo 底座自检
#   FORGE_BUILD_TARGET=forge-runtimes + WITH_DSH/WITH_OPENCODE → 额外内置 dsh / opencode
# 二者必须一起改：只打开关、不改 target，会被最小镜像的守卫明确拒绝（不静默忽略）。
#
# 变量都可在同目录 .env 里给（模板见 .env.example）；受限网络（镜像站 / 代理）也走同一套变量。
services:
  forge:
    build:
      context: .
      target: ${FORGE_BUILD_TARGET:-forge}
      args:
        WITH_DSH: ${WITH_DSH:-false}
        WITH_OPENCODE: ${WITH_OPENCODE:-false}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        DSH_VERSION: ${DSH_VERSION:-latest}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    image: ${FORGE_IMAGE:-ark-forge}:${FORGE_TAG:-local}
    container_name: ${FORGE_CONTAINER:-ark-forge}
    restart: unless-stopped
    # 镜像 ENTRYPOINT 已带 tini（PID 1 收 agent 子进程的孤儿），这里不必再 init: true
    ports:
      # 默认只绑宿主机回环：控制面默认**无鉴权**，对外必须先设 FORGE_TOKEN（docs/deployment.md §2.1）
      - "127.0.0.1:${FORGE_PORT:-10001}:10001"
    environment:
      # 容器内必须监听 0.0.0.0，否则 -p 映射不进来
      FORGE_ADDR: 0.0.0.0:10001
      FORGE_STORE: sqlite
      # 空值 = 保持平台默认（无鉴权 / 工作区不限制）；对外部署务必把 FORGE_TOKEN 设上
      FORGE_TOKEN: ${FORGE_TOKEN:-}
      FORGE_WORKSPACE_ROOTS: ${FORGE_WORKSPACE_ROOTS:-}
      FORGE_WORKSPACE_DIR: ${FORGE_WORKSPACE_DIR:-/data/workspaces}
      # 想把可选工作区收在挂载视图内（推荐对外部署）时，在 .env 里成对设置：
      #   FORGE_WORKSPACE_ROOTS=/workspaces
      #   FORGE_WORKSPACE_DIR=/workspaces/.forge-tmp   # 必须落在白名单内，否则启动即失败（fail closed）
    volumes:
      # 会话 / transcript / agents / capabilities / 配置全在这一个卷里（容器重建不丢）
      - forge-data:/data
      # 工作空间只能是「容器挂载视图内」的目录：宿主机目录 bind mount 进来，会话 cwd 用容器内路径
      # - ./:/workspaces/repo
      # - /srv/notes:/workspaces/notes:ro
volumes:
  forge-data:
