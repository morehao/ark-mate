# ark-mate 单机容器部署（docker compose up -d --build）
#
# 镜像形态由 build.target 与两个开关共同决定（与 Dockerfile 一致）：
#   默认（不改任何变量）        → 最小镜像：只含 mate 本体
#   MATE_BUILD_TARGET=mate-runtimes + WITH_DSH → 额外内置 dsh
# 二者必须一起改：只打开关、不改 target，会被最小镜像的守卫明确拒绝（不静默忽略）。
#
# **另有一个正交的变量 `MATE_RUNTIME`**：核心**认哪一个**底座（构建期 `-X` 注入，默认
# dsh = dsh）。它与 WITH_* 是两件事：后者决定镜像里**装**哪几份底座二进制。
# 用户面改不了它——换底座要重新构建（见 README「底座由构建期固定」）。
#
# 变量都可在同目录 .env 里给（模板见 .env.example）；受限网络（镜像站 / 代理）也走同一套变量。
services:
  mate:
    build:
      context: .
      target: ${MATE_BUILD_TARGET:-mate}
      args:
        MATE_RUNTIME: ${MATE_RUNTIME:-dsh}
        WITH_DSH: ${WITH_DSH:-false}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        DSH_VERSION: ${DSH_VERSION:-latest}
    image: ${MATE_IMAGE:-ark-mate}:${MATE_TAG:-local}
    container_name: ${MATE_CONTAINER:-ark-mate}
    restart: unless-stopped
    # 镜像 ENTRYPOINT 已带 tini（PID 1 收 agent 子进程的孤儿），这里不必再 init: true
    ports:
      # 默认只绑宿主机回环：控制面默认**无鉴权**，对外必须先设 MATE_TOKEN（docs/deployment.md §2.1）
      - "127.0.0.1:${MATE_PORT:-10001}:10001"
    environment:
      # 容器内必须监听 0.0.0.0，否则 -p 映射不进来
      MATE_ADDR: 0.0.0.0:10001
      MATE_STORE: sqlite
      # 空值 = 保持平台默认（无鉴权 / 工作区不限制）；对外部署务必把 MATE_TOKEN 设上
      MATE_TOKEN: ${MATE_TOKEN:-}
      # 模型密钥：daemon 原样透传给 runtime 子进程（底座从进程环境读）。
      # 留空 = 容器内为空串（Node 侧 falsy，等同未设置）；也可改用面板「Provider 档案」注入（两者并存时以档案为准）。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MATE_WORKSPACE_ROOTS: ${MATE_WORKSPACE_ROOTS:-}
      MATE_WORKSPACE_DIR: ${MATE_WORKSPACE_DIR:-/data/workspaces}
      # 想把可选工作区收在挂载视图内（推荐对外部署）时，在 .env 里成对设置：
      #   MATE_WORKSPACE_ROOTS=/workspaces
      #   MATE_WORKSPACE_DIR=/workspaces/.mate-tmp   # 必须落在白名单内，否则启动即失败（fail closed）
    volumes:
      # 会话 / transcript / agents / capabilities / 配置全在这一个卷里（容器重建不丢）
      - mate-data:/data
      # 工作空间只能是「容器挂载视图内」的目录：宿主机目录 bind mount 进来，会话 cwd 用容器内路径
      # - ./:/workspaces/repo
      # - /srv/notes:/workspaces/notes:ro
volumes:
  mate-data:
