# 桌面产品打包配置（M4-1 填实；签名与加固运行时是 M4-2a、Windows 安装器是 M4-3）。
#
# ## 包内布局是**契约**，不是随手写的
#
# 壳按两类根解析路径（`src/paths.ts`，设计 §6.1 最后一条：路径算错必须明确失败，不做多级回落搜索）：
#   - `app.getAppPath()`（= asar 内）：`dist/`（主进程 + preload）、`renderer/`（壳静态页）；
#   - `process.resourcesPath`（= asar 外）：`forge-core`、`web/`、`payloads/`、`runtime/bin/`、`release.json`。
# 所以 `files` **只**带壳自己的两个目录，`resources/**` 一律走 `extraResources`——把几百 MB 的
# 载荷塞进 asar 不但体积翻倍，还会让 `payloads/` 不再是"随包只读的一份文件树"（设计 §6.3）。
#
# ## 为什么用 beforeBuild 钩子声明"node_modules 我们自己管"
#
# 本应用没有生产依赖（`dependencies` 为空，由 archtest 守卫）；原生的 `.node` 都在**载荷**里，
# 装配时就按目标平台的 ABI 选好了（M3-1/M3-7）。所以既不需要依赖安装/重建（那会触发 node-gyp），
# 也不需要 electron-builder 的 node module collector（它起步就是 `pnpm list --prod --json`，
# 把包管理器的 store 状态拖进打包路径；受限环境里打不开那个 SQLite 索引就整包失败）。
# 钩子返回 false 同时关掉这两件事，理由与代价写在 `scripts/electron-builder-before-build.cjs`。
appId: com.arkmate.desktop
productName: ark-mate
directories:
  output: release
  buildResources: build
asar: true
beforeBuild: './scripts/electron-builder-before-build.cjs'
# 逐对象复核/补签（M4-2a）：osx-sign 已经逐对象签过，这个钩子找漏网的（未签 / 缺 runtime 标记）
# 并按需重封外层封条。为什么不能在 afterSign 里无脑重签：外层 CodeResources 封条会被改坏——见钩子注释。
# 注意 `afterSign` 是**根级**选项（不是 mac 段下的）——放错位置 electron-builder 会以
# "configuration.mac should be one of these: null" 报出来（实测踩到，Schema 的报错不含键名）。
afterSign: './scripts/after-sign.cjs'
# 只带壳自己的产物；`resources/` 与 `release/` 是打包期装配的输入/输出，不能进 asar。
files:
  - dist/**
  - renderer/**
  - package.json
  - '!resources/**'
  - '!release/**'
  - '!scripts/**'
  - '!runtime/**'
  - '!build/**'
  - '!**/*.map'
# 随包运行时树：这些**必须**是 asar 外的真文件（核心要被 spawn、载荷要被 Node 解析、
# 私有 bin 要被前置进子进程 PATH），路径与 src/paths.ts 的打包态分支逐一对应。
extraResources:
  - from: resources/forge-core
    to: forge-core
  - from: resources/web
    to: web
  - from: resources/payloads
    to: payloads
  - from: resources/runtime/bin
    to: runtime/bin
  # 唯一发布契约随包（M4-5 的 `forge doctor` 与合规门禁读它；verify 会断言它与源文件逐字节相同）。
  - from: release.json
    to: release.json
  # 随包再分发的合规文件（M4-5，设计 §11）：THIRD-PARTY-NOTICES + CycloneDX SBOM。
  # 由 `scripts/gen-compliance.mjs` 从 release.json + 载荷清单 + 载荷树生成（生成物，不手改）；
  # 判据是 `verify-compliance.mjs --require-artifacts`：包内这份与源文件逐字节相同、且与契约一致（V14）。
  - from: resources/compliance
    to: compliance
mac:
  target:
    - dmg
    - tar.gz
  category: public.app-category.developer-tools
  # 产物名里带上平台：一份 release 目录里 mac 与 win 的产物要能共存、能一眼分辨。
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  # 无证书形态（§12.27）：显式 ad-hoc 签名（`codesign -s -`），不再依赖"机器上恰好有证书"。
  # 为什么不是 `identity: null`：那会**完全跳过**签名，而未签名的对象在 arm64 上会被内核
  # 直接 SIGKILL——"解包后首启无阻断"这条验收当场不成立。ad-hoc 只证明"包没被损坏"，
  # 不证明来源（代价已写在 §12.27）。
  identity: '-'
  # —— hardened runtime（M4-2a）——
  # 打开 `--options runtime`：这是"签名能不能被平台接受"这一半的判据（设计 §6.3 回退条件 ②）。
  # 两条 entitlement 的最小集与逐条理由写在 build/entitlements.mac.plist 的注释里；
  # 刻意**没有**加 `allow-unsigned-executable-memory`（能不加就不加，需要时按证据补）。
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 公证：**不做，且是长期口径**（计划 §12.27：不上架、不购买 Apple Developer 证书；
  # 2026-09-28 项目方确认"没有证书、也不需要上架应用市场" → M4-2b 不执行）。
  # 显式 false 而不是留给 electron-builder 去猜：日志里那句 `skipped macOS notarization`
  # 就是这条的结果，是预期而非失败。设了 MAC_NOTARIZE 或任何证书类凭据，build-release-json 会直接失败。
  notarize: false
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  # per-user 免 UAC 安装（设计 §8.1）：M4-3 在 nsis 段补原子安装（staging + 同卷 rename + 回滚）、
  # 长路径处理，以及 GitHub Actions windows-latest 上的 装→启→卸 冒烟。本任务只把 target 定下来。
