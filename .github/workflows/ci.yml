# CI 基线（2026-10-22 立）
#
# 在这之前仓库**没有任何 CI**：历次"全绿"都只有本地证据（`docs/agents/commands.md` 里的
# 四条命令）。这个工作流只做一件事——把本地那四条命令搬到每次 push/PR 上跑，不假装覆盖更多。
#
# 刻意**不做**的事（每条都有代价理由）：
#   - 不打包、不生成 `frontend/apps/desktop/release.json`：那是 `.gitignore` 的本地生成物，
#     生成它要把前端 dist + 内核二进制整条打包链拖进来。判据侧已改成"缺 release.json 就退回
#     `runtime/dsh/package.json` 的手写 pin 并打印说明"（`TestDshIdentityPatchMatchesPayloadPin`），
#     所以这里不需要为了一份产物去装 node/pnpm。
#   - 不跑前端界面验收与桌面验收：那要真 Electron/Chrome + 真底座 + 会真跑模型，GitHub 的
#     Linux runner 上跑不出有意义的结论（桌面是交付主线，见决策 v8/v9）。前端这边只做
#     **类型检查 + 构建 + 纯 node 单测**（`frontend` job，2026-10-22 加）。
#   - 不做交叉编译与容器构建：`docs/agents/build-and-runtime.md` 说清了 `CGO_ENABLED=0` 的性质，
#     这里只用它跑测试，不产出发布物。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一条分支上的新 push 取消上一轮：这类判据的价值在于"最新提交是否绿"，不是完整历史。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端 · 构建 / vet / 判据 / 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 纯 Go 的 SQLite 驱动（golib ≥ v1.32.22）让这个值成为**可执行的约定**而不是愿望：
      # 关掉 CGO 还能编能测，才证明本仓确实不依赖 C 工具链（2026-10-10 曾因写死 0 而
      # 在 CGO 驱动时代静默产出运行期不可用的 SQLite 面，见 build-and-runtime.md）。
      CGO_ENABLED: "0"
    steps:
      # fetch-depth: 0 是**判据的硬需求**，不是保险：`docs_consistency_test.go` 用
      # `git rev-parse --verify <hash>^{commit}` 复核 docs/unimplemented.md 里的历史提交锚
      # （归档文档已删，`git show <rev>` 是它唯一的复核入口）。checkout 默认 `fetch-depth: 1`
      # 的浅克隆里任何历史提交都查不到，于是那条判据把「克隆太浅」报成二十来行
      # 「记录列无法复核」——这是这条 CI 第一次真实运行红出来的原因（2026-10-22）。
      # 判据侧也已改成浅克隆直接 Fatal 并说明原因，两层都不许静默。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # 版本以 go.mod 为准（Go 命令一律在 backend/ 下跑，仓库根没有 go.mod）。
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go build
        run: go build ./...

      # gofmt -l 非空即失败：gofmt 能自动修的可读性问题不该进仓。
      # 判据口径与 `gofmt -l` 一致（gofmt 自带，不依赖第三方工具链）。
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt（请 gofmt -w）："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint（2026-11-07 立）：拦 thelper 等 gofmt / go vet 覆盖不到的机械规范。
      # golangci-lint v2.x 才支持 go 1.26（本仓 go.mod 是 1.26.1），故用 action v8（兼容 golangci-lint ≥v2.1.0）+ pin v2.15。
      # 配置见 backend/.golangci.yml（只启用 govet / thelper / gofmt 三项，存量已 0 issue）。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          working-directory: backend
          args: --timeout=5m

      # govulncheck（2026-11-07 立）：依赖树已知 CVE 的判据。
      # 首观察期（R 同 test-cover 的口径）：先 continue-on-error 观察 1–2 周，
      # 确认现网依赖不常红后，去掉 continue-on-error 转为硬门禁。
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # 架构判据单独一步：它失败时的语义是"分层被破坏"，与普通单测失败不是一回事，
      # 分开跑能让红的那一步直接说明问题（判据条数以 docs/agents/guards.md 的「共 N 条」为准）。
      - name: 架构判据
        run: go test ./internal/archtest/ -count=1

  # `go test ./...` 拆成 3 片（2026-10-22）：整跑在 CI 上是 2 分钟上下，而且**瓶颈在编译**
  # 不是用例（本机实测 92 个包整跑 23.7s、冷缓存下 CI ~2min）。分片让三台 runner 各编各的一片。
  #
  # 切法是**按包序取模**（`NR % n == k-1`），不维护包名单：新增包自动落到某一片里，
  # 不会出现"漏掉某个包而没人发现"。代价是**均衡性一般**——本机实测三片 17s / 3.9s / 19.8s
  # （慢包会撞到同一片）。分片只影响墙钟，不影响覆盖面：元组按构造划分全集。
  # 空片直接失败（`go list` 结果为空或切法失效时不许静默跑 0 个包）。
  backend-test:
    name: 后端 · 测试分片 ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go test（本片）
        run: |
          set -euo pipefail
          total=$(go list ./... | wc -l | tr -d ' ')
          pkgs=$(go list ./... | awk -v n="$SHARDS" -v k="$SHARD" 'NR % n == k - 1')
          n=$(printf '%s\n' "$pkgs" | grep -c . || true)
          if [ "$n" -eq 0 ]; then
            echo "分片 ${SHARD}/${SHARDS} 拿到了 0 个包（共 ${total} 个）：切法已失效，拒绝以空跑收工"
            exit 1
          fi
          echo "分片 ${SHARD}/${SHARDS}: $n / $total 个包"
          go test -count=1 $pkgs

  # 数据竞争只在 -race 下可见，而普通 `go test` 分片里从不带 -race（会显著拖慢）。
  # 这里单跑并发面（与 `make test-race` 同一组包）：会话编排 / 会话用例 / 连接池拨号 / 事件总线 / 会话运行时。
  # 代价：这一片不做包序分片（并发包数量固定且都在同一台 runner），失败语义 = "并发面有竞争"。
  backend-race:
    name: 后端 · 数据竞争（-race）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # -race 判据要求 cgo（`go: -race requires cgo`），故本 job 必须 CGO_ENABLED=1
      # （与其它 job 的 CGO_ENABLED=0 相反：它们验证"纯 Go 可编可测"，本 job 只跑竞争检测）。
      # 仍是纯 Go 的 SQLite（ncruces/go-sqlite3），cgo 只用于 race 运行时，不引入 C 版驱动。
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go test -race（并发面）
        run: |
          set -euo pipefail
          pkgs="./internal/domain/session/ ./internal/service/svcsession/ ./internal/drivers/runtimeconn/ ./internal/core/eventbus/ ./internal/sessionruntime/"
          echo "race 面: $pkgs"
          go test -race -count=1 $pkgs

  frontend:
    name: 前端 · typecheck / 构建 / 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自 `frontend/package.json` 的 `packageManager: pnpm@…`（不在 workflow 里写死）。
      # `package_json_file` 必须显式指路：这个 action 默认读**仓库根**的 package.json
      # （本仓根没有，前端在 `frontend/`），否则报 "No pnpm version is specified"。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # `--ignore-scripts`：这条链**不需要任何 install 脚本的产物**。
      #   - esbuild 的平台二进制来自可选依赖（`@esbuild/linux-x64`），它的脚本在
      #     frontend/pnpm-workspace.yaml 的 allowBuilds 里本来就是 `false`；
      #   - `electron` 的 postinstall 只下载壳的运行时（~100MB），而本 job **不跑壳**：
      #     桌面构建走 `scripts/build.mjs`，把 electron 标成 external（由壳运行时提供）；
      #   - 供应链纪律也吃这条：`allowBuilds` 的语义是"未表态的脚本会报错"，不执行比逐个表态更省。
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # 逐包 `tsc --noEmit`（apps/web 走 `tsc -b`）：类型面是前后端唯一共享的契约边界，
      # packages/types 的 `BizCode` 与后端错误码三处同步，断了只会在运行期表现为 400/500。
      - run: pnpm typecheck

      # 构建：`packages/*` + `apps/*`（web 走 tsc+vite、desktop 走 esbuild）。
      # 钉的是"生产构建能过"，而不只是"类型能过"。
      - run: pnpm build

      # 纯 node 单测（`node --test`，Node 26 自带 TS 类型剥离，无额外框架）：
      # desktop-contract 钉前后端契约形状，console 钉界面组件行为（纯逻辑函数）。
      - run: pnpm test:contract
      - run: pnpm test:console

      # 组件渲染单测（Vitest + Testing Library，jsdom，headless）：测 React 组件的渲染/交互/分支。
      # 依赖全 mock（vi.mock api/store），不碰后端；见 docs/agents/testing.md L3。
      - run: pnpm test:component

      # 前端 e2e（Playwright，纯 mock 后端 + 静态服务 serve dist）：验跨组件/路由/写面装配路径。
      # Linux runner 无系统 Chrome → 装 Playwright 自带 chromium（本地开发用系统 Chrome，不下载）。
      # 见 docs/agents/testing.md L4。
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:web
        env:
          CI: "1"
